[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plus-worker"
version = "0.1.3"
description = "AWS Fargate worker for long-running plus-engine actions"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.28.0",
    "croniter>=1.3.0",
    "furl>=2.1.0",
    "markdown2>=2.4.0",
    "playwright>=1.50.0",
    "plus-core>=1.0.66",
    "plus-engine>=1.0.440",
    # wikidrama.daily_scan scores a day of Wikipedia recentchanges in pandas.
    # Lambda does not carry these; only fargate actions need them.
    "pandas>=2.0",
    "numpy>=1.26",
    # Optional at runtime -- daily_scan degrades to "review skipped" without it,
    # but the whole point of the digest is the LLM review.
    "anthropic>=0.40",
    "protobuf>=5.29.0",
    "pyarrow>=14.0.0",
    "PyMuPDF>=1.23.0",
    "requests>=2.28.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.16.0",
]

[project.scripts]
plus-worker = "src.worker:main"
